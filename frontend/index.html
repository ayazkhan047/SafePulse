<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>SafePulse — Data-Driven Emergency Response & Triage System</title>
  <meta name="description" content="SafePulse: Priority-first emergency guidance and machine learning urgency classification with Phantom Protocol offline edge resilience.">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/emergency.css">

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e03145">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="top-nav">
    <div class="brand-wrap" onclick="SafePulseState.setView('home')">
      <div class="brand-icon">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      </div>
      <div class="brand-text">
        <h1>Safe<span>Pulse</span></h1>
        <p>Emergency Intelligence</p>
      </div>
    </div>

    <!-- Navigation Menu Links -->
    <nav class="nav-menu">
      <button class="nav-link active" data-view="home" onclick="SafePulseState.setView('home')">Home</button>
      <button class="nav-link" data-view="firstaid" onclick="SafePulseState.setView('firstaid')">First-Aid</button>
      <button class="nav-link" data-view="analytics" onclick="SafePulseState.setView('analytics')">ML Analytics</button>
      <button class="nav-link" data-view="history" onclick="SafePulseState.setView('history')">Audit Log</button>
    </nav>

    <!-- Header Actions (Protocol Badge, Theme Toggle, Emergency SOS) -->
    <div class="nav-actions">
      <!-- Phantom Protocol Edge Status Indicator -->
      <div id="protocolBadge" class="protocol-pill" title="Phantom Protocol automatically switches to embedded edge triage when disconnected">
        <span class="dot"></span>
        <span>SYSTEM ONLINE</span>
      </div>

      <!-- Theme Mode Toggle -->
      <button class="btn-secondary" style="padding:7px 11px;border-radius:50%;" title="Toggle Dark/Light Mode" onclick="SafePulseState.toggleDarkMode()">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
      </button>

      <!-- Voice Assistant Header Launcher -->
      <button class="btn-secondary" style="padding:7px 12px;font-size:13px;display:flex;align-items:center;gap:6px;border-color:var(--blue-500);color:var(--blue-500);" title="Voice Assistant" onclick="SafePulseState.setView('home'); setTimeout(() => { const card = document.getElementById('voiceCard'); if(card) card.scrollIntoView({behavior:'smooth'}); const mic = document.getElementById('btnVoiceMic'); if(mic) mic.click(); }, 200);">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z"/></svg>
        <span>Voice Assistant</span>
      </button>

      <!-- Instant Emergency Services Call Button (112 in India, 911 US) -->
      <a href="tel:112" class="btn-sos" title="Direct Phone Call to 112 / 911">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
        <span>CALL 112 / 911</span>
      </a>
    </div>
  </header>

  <!-- Main Viewports Container -->
  <main class="app-container">
    <div id="homeView" class="view-screen"></div>
    <div id="wizardView" class="view-screen hidden"></div>
    <div id="criticalView" class="view-screen hidden"></div>
    <div id="resultView" class="view-screen hidden"></div>
    <div id="firstAidView" class="view-screen hidden"></div>
    <div id="analyticsView" class="view-screen hidden"></div>
    <div id="historyView" class="view-screen hidden"></div>
  </main>

  <!-- Application Logic Scripts -->
  <script src="/js/state.js"></script>
  <script src="/js/phantom_engine.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/audio_metronome.js"></script>
  <script src="/js/voice_assistant.js"></script>
  <script src="/js/triage_wizard.js"></script>
  <script src="/js/first_aid.js"></script>
  <script src="/js/analytics_view.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
